<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#b9f23c">
  <title>拍掉！· 脸红心跳研究所</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-game="swat">
  <main class="app-shell">
    <section class="screen single-game-screen active">
      <header class="single-nav"><a href="index.html" aria-label="返回游戏目录">←</a><span>独立小游戏 05</span><b>拍掉！</b></header>
      <div class="single-intro">
        <p class="eyebrow">损友专用 · 点击手速</p>
        <h1>拍掉！</h1>
        <p>蚊子专挑朋友的脸飞。拍中蚊子，也顺手把朋友拍到鼻青脸肿。正脸照效果最好。</p>
        <div id="singlePreview" class="single-preview"></div>
        <label class="mini-upload" for="singlePhotoInput">＋ 上传朋友照片当主角</label>
        <input id="singlePhotoInput" type="file" accept="image/*" hidden>
        <button id="singleStart" class="primary-button" type="button">开拍！别手软 <span>→</span></button>
      </div>
      <div class="single-play" hidden>
        <div class="single-hud"><b id="singleScore">0 分</b><button id="singleRestart" type="button">重新开始</button></div>
        <div id="singleTimer" class="timer-track"><span></span></div>
        <div id="singleStage" class="game-stage"></div>
        <div id="singleFeedback" class="feedback"></div>
      </div>
      <div id="singleResult" class="single-result" hidden>
        <p id="singleResultEmoji">🤕</p>
        <h2 id="singleResultTitle">蚊子没了，脸也肿了！</h2>
        <div id="swatResultFace" class="swat-result-face" hidden></div>
        <strong id="singleResultScore">100 分</strong>
        <button id="singleAgain" class="primary-button dark" type="button">再拍一顿</button>
        <a href="index.html">返回小游戏目录</a>
      </div>
    </section>
  </main>
  <script src="single-game.js"></script>
</body>
</html>
